# ==============================================================================
# Render Blueprint - TrazaCao Huila (Backend API REST & Base de Datos SQLite WAL)
# II Hackathon de Programación DEVURITY - Universidad Surcolombiana
# Conexión directa con GitHub: Cada push a 'main' despliega en vivo
# ==============================================================================
services:
  - type: web
    name: trazacao-backend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_PATH
        value: "/app/cacao_dev.db"
